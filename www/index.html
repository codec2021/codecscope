<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H26xBrowser - H.264/H.265/H.266 码流分析</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>H26x<span class="accent">Browser</span></h1>
    <div class="header-actions">
      <span id="codecBadge" class="codec-badge hidden"></span>
      <button id="openBtn" class="btn">打开文件</button>
      <button id="resetBtn" class="btn btn-secondary hidden">重置</button>
      <input type="file" id="fileInput" hidden accept=".h264,.h265,.hevc,.h266,.vvc,.266,.265,.264,.avc,.bin,.bit,.mp4,.m4v,.mov">
      <span id="fileName" class="file-name">未加载文件</span>
    </div>
  </header>

  <div id="dropzone" class="dropzone">
    <div class="dropzone-inner">
      <p>将 <strong>.h264 / .h265 / .h266 / .mp4</strong> 码流文件拖放到此处</p>
      <p class="hint">支持 H.264(AVC) / H.265(HEVC) / H.266(VVC) 裸流，以及 MP4/MOV 封装（自动解封装）。</p>
    </div>
  </div>

  <section id="statsBar" class="stats-bar hidden"></section>

  <section id="timelinePanel" class="timeline-panel hidden">
    <div class="panel-title">帧结构 (Slice 类型时间轴) <span id="timelineLegend" class="legend"></span></div>
    <div class="timeline-wrap"><canvas id="timeline" class="timeline"></canvas></div>
  </section>

  <main id="mainArea" class="main-area hidden">
    <section class="panel nal-panel">
      <div class="panel-title">NAL 单元列表 <span id="nalCount" class="count"></span></div>
      <div id="nalScroll" class="nal-scroll">
        <div id="nalSpacer"></div>
        <div id="nalRows"></div>
      </div>
      <div id="nalHeaderRow" class="nal-header">
        <span class="c-offset">Offset</span>
        <span class="c-length">Length</span>
        <span class="c-type">类型</span>
        <span class="c-info">信息</span>
      </div>
    </section>

    <section class="panel syntax-panel">
      <div class="panel-title">
        语法元素 <span id="syntaxTitle" class="count"></span>
        <div class="tab-group">
          <button id="tabSyntax" class="tab active">语法树</button>
          <button id="tabPreview" class="tab">画面</button>
          <button id="tabHex" class="tab">Hex 视图</button>
        </div>
      </div>
      <div id="syntaxTree" class="syntax-tree"></div>
      <div id="previewView" class="preview-view hidden">
        <div class="preview-wrap">
          <canvas id="previewCanvas" class="preview-canvas"></canvas>
          <div class="preview-side">
            <div class="preview-controls">
              <button id="previewPlayBtn" class="btn btn-small">▶ 播放</button>
              <span id="previewHint" class="legend"></span>
            </div>
            <div id="previewMsg" class="preview-msg">点击时间轴上的帧查看画面</div>
          </div>
        </div>
      </div>
      <div id="hexView" class="hex-view hidden"></div>
    </section>
  </main>

  <section id="bottomPanels" class="bottom-panels hidden">
    <section class="panel hdr-panel">
      <div class="panel-title">HDR / 色彩信息</div>
      <div id="hdrInfo" class="kv-list"></div>
    </section>

    <section class="panel warning-panel">
      <div class="panel-title">
        警告 <span id="warningCount" class="count"></span>
        <select id="warningFilter" class="filter">
          <option value="-1">全部</option>
          <option value="1">数值越界</option>
          <option value="2">引用结构不存在</option>
          <option value="3">Profile 一致性</option>
        </select>
      </div>
      <div class="table-wrap">
        <table id="warningTable">
          <thead><tr><th>Offset</th><th>消息</th></tr></thead>
          <tbody id="warningBody"></tbody>
        </table>
      </div>
    </section>
  </section>

  <footer class="statusbar">
    <span id="status">正在加载解析模块…</span>
  </footer>

  <script src="hevc.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
